[program:kernelbridge-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/kernelbridge/current/artisan queue:work redis --queue=notifications,default --sleep=3 --tries=3 --backoff=10 --timeout=120 --max-time=3600
directory=/var/www/kernelbridge/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/kernelbridge-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
environment=APP_ENV="production"
