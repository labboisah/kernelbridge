server {
    listen 80;
    listen [::]:80;
    server_name kernelbridge.com www.kernelbridge.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kernelbridge/current/public;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://kernelbridge.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kernelbridge.com;

    ssl_certificate /etc/letsencrypt/live/kernelbridge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kernelbridge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kernelbridge.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kernelbridge.com;

    root /var/www/kernelbridge/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/kernelbridge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kernelbridge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kernelbridge.access.log;
    error_log /var/log/nginx/kernelbridge.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\. {
        deny all;
    }
}
