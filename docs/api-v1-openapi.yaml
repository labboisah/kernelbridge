openapi: 3.1.0
info:
  title: KernelBridge Product Integration API
  version: 1.0.0
  description: Machine-to-machine API for authorized KernelBridge products.
servers:
  - url: https://kernelbridge.com/api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: KernelBridge client credential
  schemas:
    Error:
      type: object
      required: [success, error, meta]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
paths:
  /products/{code}:
    get:
      summary: Retrieve the authenticated client's product
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Product }, '401': { description: Invalid credential } }
  /licenses/activate:
    post:
      summary: Activate a license for a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, device_id]
              properties:
                license_key: { type: string }
                device_id: { type: string }
                device_name: { type: string }
                machine_fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
                device_info:
                  type: object
                  properties:
                    hostname: { type: string }
                    os: { type: string }
                    architecture: { type: string }
                    client_version: { type: string }
                    platform_url: { type: string, format: uri }
      responses: { '201': { description: Activated }, '422': { description: Invalid license } }
  /licenses/verify:
    post:
      summary: Verify an active device license
      responses: { '200': { description: Verified } }
  /licenses/deactivate:
    post:
      summary: Deactivate a device license
      responses: { '200': { description: Deactivated } }
  /subscriptions/status:
    get:
      summary: Retrieve subscription status
      parameters:
        - { name: subscription_uuid, in: query, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Subscription status } }
  /entitlements:
    get:
      summary: Retrieve current snapshotted entitlements
      parameters:
        - { name: subscription_uuid, in: query, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Entitlements } }
  /demo/events:
    post:
      summary: Submit an idempotent product demo event
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [session_uuid, event_id, event_type, occurred_at], properties: { session_uuid: { type: string, format: uuid }, event_id: { type: string }, event_type: { type: string, enum: [session_start, page_view, feature_used, workflow_completed, cta_clicked, request_full_version, session_end] }, page: { type: string }, feature: { type: string }, cta: { type: string }, occurred_at: { type: string, format: date-time }, metadata: { type: object } } } } } }
      responses: { '202': { description: Accepted }, '422': { description: Invalid or duplicate event } }
  /demo/config:
    get:
      summary: Retrieve versioned Demo Mode restrictions and reset instructions
      responses: { '200': { description: Demo configuration }, '404': { description: No active profile } }
  /demo/sessions:
    post:
      summary: Start an anonymous demo session
      responses: { '201': { description: Session started }, '422': { description: Invalid or exhausted access token } }
  /demo/sessions/{session_uuid}/end:
    post:
      summary: End a demo session
      parameters:
        - { name: session_uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Session ended } }
  /demo/resets/acknowledge:
    post:
      summary: Acknowledge local execution of the current reset instruction
      responses: { '200': { description: Reset acknowledged }, '422': { description: Stale instruction version } }
  /mcp/customers/search:
    get:
      summary: MCP customer lookup scoped to the authenticated product
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses: { '200': { description: Matching customers }, '403': { description: Missing mcp:read scope }, '429': { description: Per-tool rate limited } }
  /mcp/customers/{customer_uuid}/services:
    get:
      summary: MCP list customer services for the authenticated product
      parameters:
        - { name: customer_uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Customer services }, '403': { description: Missing mcp:read scope }, '404': { description: Customer not found } }
  /mcp/services/{subscription_uuid}/setup:
    get:
      summary: MCP retrieve install-safe service setup values
      parameters:
        - { name: subscription_uuid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: runtime, in: query, required: true, schema: { type: string, enum: [laravel, typescript, spring-boot, django] } }
      responses: { '200': { description: Setup values with placeholder machine token }, '403': { description: Missing mcp:read scope } }
  /mcp/licenses/explain-activation-issue:
    get:
      summary: MCP explain activation or license status issues
      parameters:
        - { name: license_uuid, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: activation_uuid, in: query, required: false, schema: { type: string, format: uuid } }
      responses: { '200': { description: Activation issue explanation }, '422': { description: license_uuid or activation_uuid required } }
  /mcp/licenses/{license_uuid}/activations:
    get:
      summary: MCP list activations for one license
      parameters:
        - { name: license_uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: License activations }, '404': { description: License not found } }
  /mcp/licenses/issue:
    post:
      summary: MCP issue a license with human confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_uuid, confirmed_by, confirmation_note]
              properties:
                subscription_uuid: { type: string, format: uuid }
                max_activations: { type: integer, minimum: 1, maximum: 100 }
                confirmed_by: { type: string, maxLength: 255 }
                confirmation_note: { type: string, maxLength: 1000 }
      responses: { '201': { description: License issued }, '200': { description: Existing active license returned }, '403': { description: Missing mcp:write scope }, '422': { description: Confirmation or subscription validation failed }, '429': { description: Per-tool rate limited } }
  /mcp/license-activations/{activation_uuid}/deactivate:
    post:
      summary: MCP deactivate one activation with human confirmation
      parameters:
        - { name: activation_uuid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed_by, confirmation_note]
              properties:
                reason: { type: string, maxLength: 255 }
                confirmed_by: { type: string, maxLength: 255 }
                confirmation_note: { type: string, maxLength: 1000 }
      responses: { '200': { description: Activation deactivated }, '403': { description: Missing mcp:write scope }, '422': { description: Confirmation or activation validation failed }, '429': { description: Per-tool rate limited } }
